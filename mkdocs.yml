site_name: mr01sam Rust Plugins
site_description: Documentation for Rust Oxide/Carbon plugins by mr01sam
site_url: https://docs.example.com

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Plugins:
      - Safe Pocket: plugins/safepocket.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
